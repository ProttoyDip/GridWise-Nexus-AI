[pytest]
# Some Windows dev environments have restrictive ACLs on the default
# %TEMP%/pytest-of-<user> directory (observed: Get-Acl itself raised
# UnauthorizedAccessException on it), which breaks every test using the
# tmp_path/tmpdir fixtures with a PermissionError unrelated to the tests
# themselves. Using a project-local temp root sidesteps that entirely and
# is portable to CI.
addopts = --basetemp=.pytest_tmp
